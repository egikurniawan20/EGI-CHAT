name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform & build-tools
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK (release, signed debug key)
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Ganti nama APK
        run: cp app/build/outputs/apk/release/app-release.apk EGICHAT.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EGICHAT-APK
          path: EGICHAT.apk
          if-no-files-found: error
          retention-days: 30
